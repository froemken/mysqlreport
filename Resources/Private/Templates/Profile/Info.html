<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <h1>Query Information</h1>

    <p>
        <f:if condition="{prevRoute}">
            <f:then>
                <f:be.link route="{prevRoute}"
                           class="btn btn-primary">
                    Back
                </f:be.link>
            </f:then>
            <f:else>
                <f:be.link route="mysqlreport_profile"
                           parameters="{action: 'queryType', uniqueIdentifier: queryInformationRecord.unique_call_identifier, queryType: queryInformationRecord.query_type}"
                           class="btn btn-primary">
                    Back
                </f:be.link>
            </f:else>
        </f:if>

        <f:if condition="{queryInformationRecord.query_type} == 'SELECT'">
            <f:if condition="{prevRoute}">
                <f:then>
                    <f:be.link route="mysqlreport_profile"
                               parameters="{action: 'queryProfiling', uid: queryInformationRecord.uid, prevRoute: prevRoute}"
                               class="btn btn-primary">
                        Show Query Profile
                    </f:be.link>
                </f:then>
                <f:else>
                    <f:be.link route="mysqlreport_profile"
                               parameters="{action: 'queryProfiling', uid: queryInformationRecord.uid}"
                               class="btn btn-primary">
                        Show Query Profile
                    </f:be.link>
                </f:else>
            </f:if>
        </f:if>
    </p>

    <f:render partial="ProfileInfo" arguments="{_all}"/>
</f:section>
</html>
