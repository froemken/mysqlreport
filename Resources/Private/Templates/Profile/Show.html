<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Content">
    <h1>Queries grouped by type</h1>

    <p>
        <f:be.link route="mysqlreport_profile"
                   parameters="{action: 'list'}"
                   class="btn btn-primary">
            Back
        </f:be.link>
        <f:be.link route="mysqlreport_profile"
                   parameters="{action: 'download', uniqueIdentifier: uniqueIdentifier, downloadType: 'csv'}"
                   class="btn btn-primary">
            Download CSV
        </f:be.link>
        <f:be.link route="mysqlreport_profile"
                   parameters="{action: 'download', uniqueIdentifier: uniqueIdentifier, downloadType: 'json'}"
                   class="btn btn-primary">
            Download JSON
        </f:be.link>
    </p>

    <f:be.infobox title="Request" disableIcon="true">
        <pre><code>{profileTypes.0.request}</code></pre>
    </f:be.infobox>

    <table class="table">
        <thead>
        <tr>
            <th>Query type</th>
            <th>Amount of queries</th>
            <th>Summed Duration</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <f:for each="{profileTypes}" as="profile">
            <tr>
                <td>{profile.query_type}</td>
                <td>{profile.amount}</td>
                <td>
                    {profile.duration -> f:format.number(decimals: 6)}
                </td>
                <td>
                    <f:be.link route="mysqlreport_profile"
                               parameters="{action: 'queryType', uniqueIdentifier: profile.unique_call_identifier, queryType: profile.query_type}"
                               class="btn btn-default">
                        <core:icon identifier="actions-search"/>
                    </f:be.link>
                </td>
            </tr>
        </f:for>
        </tbody>
    </table>
</f:section>
</html>
